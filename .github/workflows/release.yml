# Signed, notarized release on a v* tag: build with scripts/release/release.sh, publish the GitHub
# release, then put the new item into the appcast on the Pages site.
#
# The Companion for Windows and Linux (apps/companion-rs) ships in v* releases only once the owner sets the
# repository variable SP_RELEASE_COMPANION_RS to true (owner decision, 2026-11-02: prereleases only until
# then, companion-rs-prerelease.yml). With it on, the release also carries the device kit
# (scripts/release/device-kit.sh) and slashplayed-companion for Windows and Linux, built against that kit
# by companion-rs-build.yml: unsigned (owner decision), with SHA256SUMS and build-provenance attestations
# (gh attestation verify <file> -R paulstraw/slashplayed). release.sh builds and checks the kit either way.
#
# The job runs in the `release` environment, which holds every signing secret; the owner approves each
# run there before any step (and so any secret) runs. Only the owner pushes tags. Never add a
# pull_request(_target) trigger.
#
# Order matters for people already running the companion: the release (and so the DMG URL the appcast
# item points at) exists before the appcast that advertises it is deployed. Re-running a run whose
# release step succeeded fails at the tag check by design: a rebuild gets a new epoch CFBundleVersion and
# DMG, which wouldn't match the assets already uploaded. Delete the release first if a redo is intended.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Same toolchain pins as ci.yml; see the comments there.
  XCODE_APP: /Applications/Xcode_27.1.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # rustup-init for scripts/build-idevice.sh (the companion links idevice). The checksum is the one
  # static.rust-lang.org publishes next to the binary (rustup-init.sha256).
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
  # Apple's "Developer ID Certification Authority" (G2) intermediate. A .p12 exported from Keychain
  # Access usually holds only the leaf, and codesign needs the chain to build a valid signature.
  # Importing it grants no trust (it still has to chain to Apple's root); the pin just keeps a swapped
  # file from being imported at all. From apple.com/certificateauthority, valid until 2031-09-17.
  DEVELOPER_ID_CA_URL: https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
  DEVELOPER_ID_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
  APPCAST_URL: https://slashplayed.strawdynamics.com/appcast.xml

jobs:
  release:
    runs-on: xcode-27
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write      # gh release create
      pages: write         # deploy-pages
      id-token: write      # deploy-pages' OIDC check, and the kit's attestation
      attestations: write  # the kit's attestation
    outputs:
      kit_sha256: ${{ steps.kit.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheap checks before an hour of building and notarizing. release.sh repeats the version and
      # changelog checks (and refuses a placeholder date); these catch a wrong tag or a re-run first.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marketing="$(awk -F'"' '/^ *MARKETING_VERSION:/ {print $2; exit}' apps/companion/project.yml)"
          if [[ "$GITHUB_REF_NAME" != "v$marketing" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/companion/project.yml MARKETING_VERSION ($marketing); expected v$marketing."
            exit 1
          fi
          if ! grep -qF "## [$marketing]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$marketing]\" section."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Delete it before re-running: a rebuild would not match its assets."
            exit 1
          fi
          echo "VERSION=$marketing" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # rustup, pinned and checked like XcodeGen: scripts/build-idevice.sh installs the Rust toolchain it
      # pins (1.99.0) and the targets through it.
      - name: Install rustup
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/aarch64-apple-darwin/rustup-init"
          echo "$RUSTUP_SHA256  $RUNNER_TEMP/rustup-init" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The companion links idevice (Sources/Pairing.swift), and the device app's JIT helper, which the
      # companion bundles (apps/client/build-helper.sh), links it for each device platform: built from
      # source at the pinned commit, a step per platform so a failure names it.
      - name: Build idevice (macOS)
        run: scripts/build-idevice.sh macos

      - name: Build idevice (visionOS)
        run: scripts/build-idevice.sh xros

      - name: Build idevice (iPadOS and iOS)
        run: scripts/build-idevice.sh ios

      # The device app's start screen face, Goodmountain, and its license (apps/client/spstart.m): its
      # license forbids changing or re-hosting the file, so it's never committed, and scripts/fetch-font.sh
      # downloads them at a pinned commit and checks their SHA-256. The companion bundles the OTF; the Pages
      # deploy below serves the webfont.
      - name: Fetch the start screen's font
        run: scripts/fetch-font.sh

      # A throwaway keychain holding only the Developer ID identity, on the search list so codesign finds
      # it (release.sh picks the one "Developer ID Application" identity there). Its password is random
      # per run and never leaves this step: the keychain stays unlocked for the job, and deleting it
      # later needs no password. No provisioning profile: the companion has no restricted entitlements.
      - name: Install the signing identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name is empty. Add it to the release environment."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          # Lock after 6h of inactivity rather than the 5 min default, which a build plus two
          # notarization round trips can outlast.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          (umask 077 && printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$DEVELOPER_ID_CA_URL"
          echo "$DEVELOPER_ID_CA_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          # Keychain Access's .p12 export usually carries this intermediate along with the identity, and
          # a second import of it fails ("already exists"). Skip it when that exact certificate (by
          # SHA-256) came in with the .p12; import it when the .p12 held only the leaf.
          ca_hash=$(printf '%s' "$DEVELOPER_ID_CA_SHA256" | tr '[:lower:]' '[:upper:]')
          if security find-certificate -a -Z "$keychain" | grep -qx "SHA-256 hash: $ca_hash"; then
            echo "Developer ID G2 CA: already in the .p12"
          else
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          fi

          # Without this, the first codesign blocks on a UI prompt nobody can answer and the job hangs
          # until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Prepend, keeping login (and anything else) so system tools still work.
          existing=()
          while IFS= read -r k; do
            k="${k#"${k%%[![:space:]]*}"}"; k="${k#\"}"; k="${k%\"}"
            [[ -n "$k" ]] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Only the path goes into the job environment; the key ID and issuer are passed straight to the
      # release step that needs them.
      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ASC_API_KEY_P8_BASE64" ]]; then
            echo "::error::Secret ASC_API_KEY_P8_BASE64 is empty. Add it to the release environment."
            exit 1
          fi
          key="$RUNNER_TEMP/asc-api-key.p8"
          (umask 077 && printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key")
          echo "ASC_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the release
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # An empty secret would make release.sh fall back to the keychain or a notary profile, which a
          # runner doesn't have; say what's actually missing instead.
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret $name is empty. Add it to the release environment."
              exit 1
            fi
          done
          RELEASE_TAG="$GITHUB_REF_NAME" scripts/release/release.sh

      # slashplayed-companion compiles this hash in (companion-rs-build.yml) and installs only this kit.
      - name: Note the device kit's hash
        id: kit
        run: echo "sha256=$(shasum -a 256 build/release/slashplayed-device-kit.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: vars.SP_RELEASE_COMPANION_RS == 'true'
        with:
          subject-path: build/release/slashplayed-device-kit.zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_KIT: ${{ vars.SP_RELEASE_COMPANION_RS == 'true' }}
        run: |
          set -euo pipefail
          assets=("build/release/Slashplayed-Companion-$VERSION.dmg")
          if [[ "$SHIP_KIT" == true ]]; then
            assets+=(build/release/slashplayed-device-kit.zip)
          else
            # Without the kit, SHA256SUMS lists only what ships.
            grep -v ' slashplayed-device-kit\.zip$' build/release/SHA256SUMS > "$RUNNER_TEMP/SHA256SUMS"
            cp "$RUNNER_TEMP/SHA256SUMS" build/release/SHA256SUMS
          fi
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Slashplayed $VERSION" --notes-file build/release/notes.md \
            "${assets[@]}" build/release/SHA256SUMS

      # The live feed is the source of truth for past items, not site/: site/'s copy is only the empty
      # seed. A 404 means nothing has been deployed yet, so start from the seed. Anything else fails the
      # job rather than publishing a feed that has silently lost every earlier release. The query string
      # sidesteps Pages' CDN cache.
      - name: Merge the appcast
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live-appcast.xml"
          status="$(curl -sS -L -o "$live" -w '%{http_code}' "$APPCAST_URL?run=$GITHUB_RUN_ID")"
          case "$status" in
            200) base="$live" ;;
            404) echo "No live appcast yet; starting from site/appcast.xml"; base=site/appcast.xml ;;
            *) echo "::error::Fetching $APPCAST_URL returned HTTP $status"; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/pages"
          cp -R site "$RUNNER_TEMP/pages"
          # The site's display face is never committed (its license forbids re-hosting it in the repo):
          # it's deployed unchanged next to the page, with its license, which the footer links to.
          scripts/fetch-font.sh
          cp work/fonts/Goodmountain-Regular.woff2 "$RUNNER_TEMP/pages/"
          cp work/fonts/LICENSE.md "$RUNNER_TEMP/pages/goodmountain-license.txt"
          scripts/release/appcast-merge.sh "$base" build/release/appcast-item.xml > "$RUNNER_TEMP/pages/appcast.xml"
          grep -c '<item>' "$RUNNER_TEMP/pages/appcast.xml" | xargs echo "Appcast items:"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      # deploy-pages targets this job's environment, `release`, rather than `github-pages`; its
      # protection rules then apply instead.
      - name: Deploy the Pages site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Clean up signing material
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/asc-api-key.p8"

  # slashplayed-companion, built against the kit the release now carries. No secrets, no environment: the
  # build is companion-rs-build.yml, the same one prereleases use.
  companion-rs-build:
    needs: release
    if: vars.SP_RELEASE_COMPANION_RS == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/companion-rs-build.yml
    with:
      kit_sha256: ${{ needs.release.outputs.kit_sha256 }}
      release_tag: ${{ github.ref_name }}

  # Onto the release: each archive, its build-provenance attestation, and SHA256SUMS with their lines
  # added to the DMG's and the kit's.
  companion-rs-publish:
    needs: companion-rs-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # gh release upload
      id-token: write      # the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: companion-rs-*
          path: companion-rs
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: companion-rs/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          (cd companion-rs && sha256sum -- *) >> "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" companion-rs/*
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/SHA256SUMS"
