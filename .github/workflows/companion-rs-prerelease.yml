# A slashplayed-companion prerelease for volunteers on Windows and Linux, from a branch (a PR's, say), started
# by hand: Actions > Companion prerelease > Run workflow, with that branch under "Use workflow from". It builds
# the commit the run is on, never one named in an input: the caches the kit job saves (companion-deps) are
# scoped to the run's branch, so a branch's code can't reach main's caches, which releases restore. Owner decision (2026-11-01):
# prereleases are published only on the owner's approval, which the `prerelease` environment asks for
# before the publish job runs; the builds before it hold no secrets and publish nothing.
#
# It builds the device kit unsigned on macOS (as release.sh does, without Developer ID or notarization: the
# kit is signed on the host by the tool), slashplayed-companion against it (companion-rs-build.yml), and publishes both
# as a GitHub prerelease tagged companion-<version>-pre.<run number>, which doesn't match release.yml's v* and so
# never starts a release, with SHA256SUMS and build-provenance attestations. The Windows .exe is unsigned
# (owner decision): the notes say to expect SmartScreen.
name: Companion prerelease

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: companion-prerelease
  cancel-in-progress: false

env:
  # The companion-deps action's pins, as in ci.yml (see the comments there).
  XCODE_APP: /Applications/Xcode_27.1.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
  IDEVICE_CACHE_PATHS: |
    work/idevice/BUILD.txt
    work/idevice/include
    work/idevice/ios
    work/idevice/xros
    work/idevice/macos
  ZSIGN_CACHE_PATHS: |
    work/zsign/BUILD.txt
    work/zsign/licenses
    work/zsign/src/zsign/src
    work/zsign/ios
    work/zsign/xros
    work/zsign/macos
  SPAPPLE_CACHE_PATHS: |
    work/spapple/BUILD.txt
    work/spapple/ios
    work/spapple/xros

jobs:
  kit:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      kit_sha256: ${{ steps.kit.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the prerelease
        id: meta
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^ *MARKETING_VERSION:/ {print $2; exit}' apps/companion/project.yml)"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "tag=companion-$version-pre.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/companion-deps

      - name: Fetch the start screen's font
        run: scripts/fetch-font.sh

      # The device builds bundle-resources.sh stages (shims, launcher, JIT helper, icon), assembled into the
      # kit. This runner has no game install, so there's nothing Blizzard's for them to have come from.
      - name: Build the device kit
        run: |
          set -euo pipefail
          sh apps/companion/bundle-resources.sh --build "$RUNNER_TEMP/stage"
          scripts/release/device-kit.sh "$RUNNER_TEMP/stage" "$RUNNER_TEMP/kit/slashplayed-device-kit.zip"

      - name: Note the kit's hash
        id: kit
        run: echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/kit/slashplayed-device-kit.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-kit
          path: ${{ runner.temp }}/kit/slashplayed-device-kit.zip
          if-no-files-found: error
          retention-days: 7

  companion-rs-build:
    needs: kit
    permissions:
      contents: read
    uses: ./.github/workflows/companion-rs-build.yml
    with:
      kit_sha256: ${{ needs.kit.outputs.kit_sha256 }}
      release_tag: ${{ needs.kit.outputs.tag }}

  publish:
    needs: [kit, companion-rs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The owner approves here, after seeing the builds pass.
    environment: prerelease
    permissions:
      contents: write      # the tag and the prerelease
      id-token: write      # the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.kit.outputs.tag }}
          SHA: ${{ needs.kit.outputs.sha }}
          VERSION: ${{ needs.kit.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS
          cat > notes.md <<EOF
          A test build of **slashplayed-companion**, which sets up Slashplayed on an iPhone or iPad from Windows
          or Linux with no Mac, built from \`$REF\` ($SHA). It's for volunteers testing it before a release:
          [the guide](https://github.com/$GITHUB_REPOSITORY/blob/$SHA/docs/setup-without-a-mac.md) says how
          to run it and what to report.

          - **Windows:** the .exe isn't signed, so SmartScreen warns about it (More info > Run anyway). It
            needs Apple's device driver: install Apple Devices from the Microsoft Store, or iTunes.
          - **Linux:** it needs usbmuxd running (most distributions package it).
          - Check a download with \`SHA256SUMS\`, or that it was built here with
            \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`.
          - Vision Pro still needs a Mac with the Slashplayed Companion.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "slashplayed-companion $VERSION prerelease ${TAG##*.}" --notes-file notes.md \
            assets/* SHA256SUMS
