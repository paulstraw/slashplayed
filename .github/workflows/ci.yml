# Unsigned builds, unit tests and the tree checks for pull requests and main.
#
# Everything here runs without an Apple account or a game install: the shims and the launcher build
# unsigned (the companion signs them with the user's identity at run time), the companion is sealed ad
# hoc by its own build.sh, and the tests build their fixtures from research/loadertest. The tests that
# read a real install are opt-in and stay off here. The release workflow is the only place that signs.
#
# Untrusted PR code runs here, so this workflow gets a read-only token and no secrets. Never switch it
# to pull_request_target.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes its older run, so that one is cancelled. A push to main never is: main's
# runs are the only ones that save the idevice cache every PR reads (caches are ref-scoped), and a
# cancelled run saves nothing, so a few merges in a row would leave every PR rebuilding it from source.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The xcode-27 image (arm64, GA since 2026-10-15) carries Xcode 27.0, 27.1 (the default) and 27.2.
  # 27.1 has the visionOS 27 and iOS 27.1 SDKs the shims build against and matches the maintainer's
  # toolchain; pinned rather than the default so an image update can't change it under a PR.
  XCODE_APP: /Applications/Xcode_27.1.app
  # Matches the local toolchain (xcodegen --version). The checksum is the digest GitHub publishes for the
  # release's xcodegen.zip asset.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # rustup-init for scripts/build-idevice.sh (the companion links idevice). The checksum is the one
  # static.rust-lang.org publishes next to the binary (rustup-init.sha256).
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
  # What the idevice and spapple caches hold (.github/actions/companion-deps, Restore idevice and Restore
  # spapple), shared by each one's restore and save in both companion jobs.
  IDEVICE_CACHE_PATHS: |
    work/idevice/BUILD.txt
    work/idevice/include
    work/idevice/ios
    work/idevice/xros
    work/idevice/macos
  SPAPPLE_CACHE_PATHS: |
    work/spapple/BUILD.txt
    work/spapple/ios
    work/spapple/xros

jobs:
  # Greps only, so a scrub or hardcoding slip fails in seconds rather than after the builds.
  check-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scrub and no-hardcoding checks
        run: scripts/check-tree.sh

  # The addons against mock WoW APIs: SPHover through the shim's own pixel-strip decoder, SPMovie's
  # tap (addon/test/test.sh). Lua 5.1, the version WoW embeds, so a 5.2+ idiom in an addon fails here
  # rather than in the game; the maintainer's Mac runs Homebrew's 5.4, so between them both are covered.
  # Not gated by changes: it takes seconds on Linux, and an ungated job never sits skipped.
  addon-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends lua5.1
          lua5.1 -v
      - name: Test the addon
        env:
          LUA: lua5.1
        run: addon/test/test.sh

  # Whether the companion jobs have anything to do: a PR that touches only the site, docs/, or Markdown
  # can't change what they build or test (nothing they run reads them), and the macOS jobs are the slow,
  # costly ones.
  # Not a workflow-level paths-ignore: that would skip check-tree too, which greps the site and docs, and
  # main's ruleset requires both checks, and a required check skipped by a path filter stays "Pending" and
  # blocks merging. A job skipped by its own if: reports "skipped", which GitHub counts as passing.
  # It errs towards building: any other path, CHANGELOG.md (release.sh reads it, and release-prep PRs
  # deserve the full run), an empty diff, a push to main, and a failure here all build. Pushes to main
  # always build, since main is what releases are tagged from and what PRs' caches restore from.
  # Plain git rather than a paths-filter action, so there's no third-party code to pin or trust.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      # A pull_request run checks out the PR merged into its base, whose first parent is the base tip, so
      # two commits of history are enough for the PR's whole diff against what it would merge into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the build is needed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: always builds"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          build=false
          [[ -n "$files" ]] || build=true
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            case "$f" in
              CHANGELOG.md) build=true; echo "builds for: $f" ;;
              site/*|docs/*|*.md) ;;
              *) build=true; echo "builds for: $f" ;;
            esac
          done <<<"$files"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build=$build"

  # The companion's build and its tests, as two jobs on two runners so the run takes about as long as
  # the slower of them rather than both in a row: test.sh builds into its own DerivedData (Debug, beside
  # build.sh's Release) and reads none of build.sh's output. Both stand on the
  # same pinned Xcode, XcodeGen, and idevice, from one local action so their cache stays shared.
  companion-build:
    needs: changes
    # !cancelled() rather than the implicit success(): if changes fails, its output is empty, and a job
    # skipped because a needed job failed would read as passing; this way a failure there still builds.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/companion-deps

      # The device app's start screen face, Goodmountain, and its license (apps/client/spstart.m): its
      # license forbids changing or re-hosting the file, so it's never committed, and scripts/fetch-font.sh
      # downloads both at a pinned commit and checks their SHA-256. The companion bundles them; the tests
      # don't read them, so only this job fetches them.
      - name: Fetch the start screen's font
        run: scripts/fetch-font.sh

      # The shims for both platforms, from the committed shims/generated/, build inside this step:
      # bundle-resources.sh --build runs shims/build.sh <platform>, beside the launcher, the JIT helper,
      # and the icon, into staging (build/companion/resources) in the background while xcodebuild
      # compiles the app, names the platform whose build failed, and --install then copies them into the
      # app. (Steps of their own here built the same shims a second time.)
      # The notices the built app ships (Sparkle's, idevice's, and the font's) are checked inside this
      # step too: bundle-resources.sh compares its own output, file for file, against
      # apps/companion/bundled-notices.txt and work/. (A test here once did that, compiling a Debug app
      # and test bundle on this runner for it; companion-test holds ClientAssembly's lists to that file.)
      - name: Build the companion (unsigned)
        run: apps/companion/build.sh

  companion-test:
    needs: changes
    # Gated like companion-build.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # idevice for every platform (test.sh's idevice-config.sh links the macOS one; AcknowledgementsTests
      # checks all three archives' notices). No font and no shims: the fixtures are built from
      # research/loadertest and the committed shims/generated/rewrite-map.txt, and the tests that read
      # build/<platform>/exports.json are opt-in.
      - uses: ./.github/actions/companion-deps

      # spguest, the launcher's loader (apps/client/spguest.c), loading the guest toy on this runner's
      # macOS: its checks (constructors, Objective-C, exceptions, thread-locals, binds, self-queries, a
      # 44 MB __TEXT) fail the step, and so does a broken copy of the toy (a cmdsize that wraps, a command
      # shorter than its struct, a segment larger in the file than in memory, bind opcodes cut short) that
      # spguest takes or crashes on (guesttest/malformed.c). SP_GUEST_REFS=none builds the toy from our own
      # code alone, with no game's imports (those need a local recon and client); clang, dyld_info, and an
      # ad hoc codesign are all it needs. It also shows the private hooks spguest registers through
      # (_objc_map_images, _objc_load_image, __unw_add_find_dynamic_unwind_sections) still work on the
      # runner's macOS. Seconds, so a step here rather than a job of its own on another macOS runner.
      - name: Test the guest loader
        env:
          SP_GUEST_REFS: none
        run: apps/client/guesttest/build.sh mac

      - name: Test the companion
        run: apps/companion/test.sh

  # The host tool (apps/companion-rs: the window, slashplayed-companion, and slashplayed-cli) on the two systems
  # it's for: its unit tests and a release build, from source as a volunteer would build it. zsign's patched
  # source comes from scripts/build-zsign.sh source (git only); build.rs compiles it with OpenSSL from
  # openssl-src. Then package.sh, as a release runs it: the crates' notices, which fail on a GPL-family
  # crate (the binaries link statically: apps/companion-rs/vendor/isideload/VENDORED.md), and on Linux the
  # check that neither program links a display library. Gated like the companion jobs.
  companion-rs:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binaries need the glibc they're built against or newer, and 22.04's
          # 2.35 reaches Ubuntu 22.04, Debian 12, and SteamOS (24.04's would need 2.39).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustup_url: x86_64-unknown-linux-gnu/rustup-init
            rustup_sha256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
            perl: perl
            python: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustup_url: x86_64-pc-windows-msvc/rustup-init.exe
            rustup_sha256: 00f139da614dced87d3c3d4121c43eebdac3c1bf8a5ee86b9d80dfd71c8d70fd
            # OpenSSL's Configure needs a native Perl on Windows (Git Bash's MSYS one fails); the runner
            # image carries Strawberry Perl. And its Python is python, not python3.
            perl: C:\Strawberry\perl\bin\perl.exe
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_SRC_PERL: ${{ matrix.perl }}
      PYTHON: ${{ matrix.python }}
    steps:
      # Line endings as committed, before anything is cloned: Git for Windows turns LF into CRLF by
      # default, and then scripts/zsign.patch no longer applies to zsign's LF sources.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup, pinned and checked as for the companion; apps/companion-rs/rust-toolchain.toml then picks Rust.
      - name: Install rustup
        env:
          RUSTUP_URL: ${{ matrix.rustup_url }}
          RUSTUP_SHA: ${{ matrix.rustup_sha256 }}
        run: |
          set -euo pipefail
          # An if, not `[[ … ]] && echo`: under set -e a false test there ends the step.
          ext=
          if [[ $RUNNER_OS == Windows ]]; then ext=.exe; fi
          init="$RUNNER_TEMP/rustup-init$ext"
          curl -fsSL -o "$init" "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$RUSTUP_URL"
          echo "$RUSTUP_SHA  $init" | sha256sum -c -
          chmod +x "$init"
          "$init" -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The toolchain rust-toolchain.toml pins, installed, made the default, and the only one. Restore
      # cargo's output runs `rustc -vV` from the repo's root, where no toolchain file applies, and hashes
      # every toolchain `rustup toolchain list` shows into the cache's key. The runner images come with
      # rustup and a stable Rust of their own already in ~/.cargo, which nothing here uses: left there, an
      # image update to the next stable would miss the cache though the build hadn't changed (and a
      # self-hosted runner with no default would fail the key). The toolchain file stays the only pin;
      # this just reads it.
      - name: Install the pinned Rust
        working-directory: apps/companion-rs
        run: |
          set -euo pipefail
          rustup toolchain install
          toolchain=$(rustup show active-toolchain)
          # A CR is stripped in case Windows' rustup.exe ends its lines with CRLF.
          toolchain=${toolchain%$'\r'}; toolchain=${toolchain%% *}
          rustup default "$toolchain"
          rustup toolchain list --quiet | while IFS= read -r t; do
            t=${t%$'\r'}; t=${t%% *}
            if [[ -n $t && $t != "$toolchain" ]]; then rustup toolchain uninstall "$t"; fi
          done
          rustup toolchain list
          rustc -vV

      # Cargo's output from main's last run: the crates, and build.rs's OpenSSL (openssl-src) and zsign,
      # which on a cold run are most of the job, twice (debug for the tests, release for the build), and
      # on Windows twenty minutes of it. Swatinem/rust-cache keys it on the runner, the compiler's
      # version, rust-toolchain.toml, Cargo.toml and Cargo.lock, and the CARGO/CC/RUST env; `key` adds
      # the target and what build.rs builds from that cargo can't see. build.rs tells cargo to rerun it
      # only for spzsign_host.cpp and two env vars, so a changed scripts/build-zsign.sh pin or
      # scripts/zsign.patch (new zsign source in work/zsign/src) would otherwise reuse the old zsign and
      # OpenSSL. They're in `key`, not just the lockfile part of the key, because rust-cache falls back
      # to any cache with the same `key` and env and a different lockfile: a zsign change has to miss
      # outright, never land on an older build of it.
      # cache-workspace-crates: OpenSSL and zsign are this crate's own build script's output, which
      # rust-cache otherwise drops as a workspace crate's; without it the cache holds only the crates.
      # Saved only from main's pushes, as the companion's caches effectively are: a cache is scoped to the
      # ref that saved it, so main never reads a PR's (untrusted code can't reach main's builds), and a
      # PR's would serve only that PR's own reruns while spending the repository's cache space (these are
      # hundreds of MB each, and an evicted idevice cache costs every PR its five minutes). PRs
      # restore main's. companion-rs-build.yml, which builds what releases ship, uses no cache: those
      # builds stay cold, from source.
      - name: Restore cargo's output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/companion-rs -> target
          # matrix.os first: rust-cache keys on the OS's family, not its release, and a build from a newer
          # Ubuntu (a newer glibc) mustn't restore onto 22.04.
          key: ${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('scripts/build-zsign.sh', 'scripts/zsign.patch', 'apps/companion-rs/build.rs', 'apps/companion-rs/zsign/**') }}
          # build.rs and openssl-src read these (SP_ZSIGN_SRC, SP_KIT_SHA256, OPENSSL_SRC_PERL), so a
          # change to one is a different build.
          env-vars: SP_ OPENSSL
          cache-workspace-crates: true
          # Nothing here is installed with cargo install; ~/.cargo/bin holds only rustup's proxies.
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # A checkout stamps every file with the time it was written, and cargo reruns a build script when
      # a file it watches (build.rs itself, and spzsign_host.cpp) is newer than its last run: on every
      # run, then, rebuilding OpenSSL and zsign from scratch and wasting the cache. Both files' contents
      # are in the cache's key above, so a cache this run restored was built from exactly these bytes, and
      # an old fixed date is safe. The crate's own sources keep their times, so it recompiles as it should.
      - name: Let the cached build script stand
        run: touch -d '2000-01-01T00:00:00Z' apps/companion-rs/build.rs apps/companion-rs/zsign/spzsign_host.cpp

      - name: Fetch zsign's source
        run: scripts/build-zsign.sh source

      # The window's title face, which package.sh puts beside it unchanged.
      - name: Fetch the window's font
        run: scripts/fetch-font.sh

      - name: Test slashplayed-companion
        working-directory: apps/companion-rs
        run: cargo test --locked

      - name: Build slashplayed-companion
        working-directory: apps/companion-rs
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package it, with its notices
        env:
          TARGET: ${{ matrix.target }}
        run: apps/companion-rs/package.sh "$TARGET" "$RUNNER_TEMP/companion-rs"
