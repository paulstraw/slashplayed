# Unsigned builds, unit tests and the tree checks for pull requests and main.
#
# Everything here runs without an Apple account or a game install: the shims and the launcher build
# unsigned (the companion signs them with the user's identity at run time), the companion is sealed ad
# hoc by its own build.sh, and the tests build their fixtures from research/loadertest. The tests that
# read a real install are opt-in and stay off here. The release workflow is the only place that signs.
#
# Untrusted PR code runs here, so this workflow gets a read-only token and no secrets. Never switch it
# to pull_request_target.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes its older run, so that one is cancelled. A push to main never is: main's
# runs are the only ones that save the idevice and zsign caches every PR reads (caches are ref-scoped), and
# a cancelled run saves nothing, so a few merges in a row would leave every PR rebuilding both from source.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The xcode-27 image (arm64, GA since 2026-10-15) carries Xcode 27.0, 27.1 (the default) and 27.2.
  # 27.1 has the visionOS 27 and iOS 27.1 SDKs the shims build against and matches the maintainer's
  # toolchain; pinned rather than the default so an image update can't change it under a PR.
  XCODE_APP: /Applications/Xcode_27.1.app
  # Matches the local toolchain (xcodegen --version). The checksum is the digest GitHub publishes for the
  # release's xcodegen.zip asset.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # rustup-init for scripts/build-idevice.sh (the companion links idevice). The checksum is the one
  # static.rust-lang.org publishes next to the binary (rustup-init.sha256).
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
  # What the idevice and zsign caches hold (.github/actions/companion-deps, Restore idevice), shared by
  # each one's restore and save in both companion jobs.
  IDEVICE_CACHE_PATHS: |
    work/idevice/BUILD.txt
    work/idevice/include
    work/idevice/ios
    work/idevice/xros
    work/idevice/macos
  ZSIGN_CACHE_PATHS: |
    work/zsign/BUILD.txt
    work/zsign/licenses
    work/zsign/src/zsign/src
    work/zsign/ios
    work/zsign/xros
    work/zsign/macos

jobs:
  # Greps only, so a scrub or hardcoding slip fails in seconds rather than after the builds.
  check-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scrub and no-hardcoding checks
        run: scripts/check-tree.sh

  # The companion's build and its tests, as two jobs on two runners so the run takes about as long as
  # the slower of them rather than both in a row: test.sh builds into its own DerivedData (Debug, beside
  # build.sh's Release) and reads none of build.sh's output, but for one test (below). Both stand on the
  # same pinned Xcode, XcodeGen, idevice, and zsign, from one local action so their caches stay shared.
  companion-build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/companion-deps

      # The device app's start screen face, Goodmountain, and its license (apps/client/spstart.m): its
      # license forbids changing or re-hosting the file, so it's never committed, and scripts/fetch-font.sh
      # downloads both at a pinned commit and checks their SHA-256. The companion bundles them; the tests
      # read them only beside the built app (below), so only this job fetches them.
      - name: Fetch the start screen's font
        run: scripts/fetch-font.sh

      # The shims for both platforms, from the committed shims/generated/, build inside this step:
      # bundle-resources.sh runs shims/build.sh <platform> into the app, beside the launcher, the JIT
      # helper, and the icon, and names the platform whose build failed. (Steps of their own here built
      # the same shims a second time.)
      - name: Build the companion (unsigned)
        run: apps/companion/build.sh

      # The one test that reads build.sh's output: the notices the built app ships (Sparkle's, idevice's,
      # zsign's, OpenSSL's, and the font's) against work/ and ClientAssembly's list. It skips when there's
      # no built app, which there never is in companion-test, so it runs here, after the build, at the
      # price of compiling the test bundle on this runner too; companion-test skips it by name.
      - name: Test the built companion's notices
        run: apps/companion/test.sh -only-testing:SPCompanionTests/AcknowledgementsTests/testBuiltCompanionShipsTheNotices

  companion-test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # idevice for every platform (test.sh's idevice-config.sh links the macOS one; AcknowledgementsTests
      # checks all three archives' notices) and zsign for macOS (DeviceSigningTests runs spsign.m on the
      # Mac). No font and no shims: the fixtures are built from research/loadertest and the committed
      # shims/generated/rewrite-map.txt, and the tests that read build/<platform>/exports.json are opt-in.
      - uses: ./.github/actions/companion-deps

      - name: Test the companion
        run: apps/companion/test.sh -skip-testing:SPCompanionTests/AcknowledgementsTests/testBuiltCompanionShipsTheNotices
