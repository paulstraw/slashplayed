# Unsigned builds, unit tests and the tree checks for pull requests and main.
#
# Everything here runs without an Apple account or a game install: the shims and the launcher build
# unsigned (the companion signs them with the user's identity at run time), the companion is sealed ad
# hoc by its own build.sh, and the tests build their fixtures from research/loadertest. The tests that
# read a real install are opt-in and stay off here. The release workflow is the only place that signs.
#
# Untrusted PR code runs here, so this workflow gets a read-only token and no secrets. Never switch it
# to pull_request_target.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes its older run, so that one is cancelled. A push to main never is: main's
# runs are the only ones that save the idevice and zsign caches every PR reads (caches are ref-scoped), and
# a cancelled run saves nothing, so a few merges in a row would leave every PR rebuilding both from source.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The xcode-27 image (arm64, GA since 2026-10-15) carries Xcode 27.0, 27.1 (the default) and 27.2.
  # 27.1 has the visionOS 27 and iOS 27.1 SDKs the shims build against and matches the maintainer's
  # toolchain; pinned rather than the default so an image update can't change it under a PR.
  XCODE_APP: /Applications/Xcode_27.1.app
  # Matches the local toolchain (xcodegen --version). The checksum is the digest GitHub publishes for the
  # release's xcodegen.zip asset.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # rustup-init for scripts/build-idevice.sh (the companion links idevice). The checksum is the one
  # static.rust-lang.org publishes next to the binary (rustup-init.sha256).
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
  # What the idevice and zsign caches hold (.github/actions/companion-deps, Restore idevice), shared by
  # each one's restore and save in both companion jobs.
  IDEVICE_CACHE_PATHS: |
    work/idevice/BUILD.txt
    work/idevice/include
    work/idevice/ios
    work/idevice/xros
    work/idevice/macos
  ZSIGN_CACHE_PATHS: |
    work/zsign/BUILD.txt
    work/zsign/licenses
    work/zsign/src/zsign/src
    work/zsign/ios
    work/zsign/xros
    work/zsign/macos

jobs:
  # Greps only, so a scrub or hardcoding slip fails in seconds rather than after the builds.
  check-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scrub and no-hardcoding checks
        run: scripts/check-tree.sh

  # The addons against mock WoW APIs: SPHover through the shim's own pixel-strip decoder, SPMovie's
  # tap (addon/test/test.sh). Lua 5.1, the version WoW embeds, so a 5.2+ idiom in an addon fails here
  # rather than in the game; the maintainer's Mac runs Homebrew's 5.4, so between them both are covered.
  # Not gated by changes: it takes seconds on Linux, and an ungated job never sits skipped.
  addon-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends lua5.1
          lua5.1 -v
      - name: Test the addon
        env:
          LUA: lua5.1
        run: addon/test/test.sh

  # Whether the companion jobs have anything to do: a PR that touches only the site, docs/, or Markdown
  # can't change what they build or test (nothing they run reads them), and the macOS jobs are the slow,
  # costly ones.
  # Not a workflow-level paths-ignore: that would skip check-tree too, which greps the site and docs, and
  # main's ruleset requires both checks, and a required check skipped by a path filter stays "Pending" and
  # blocks merging. A job skipped by its own if: reports "skipped", which GitHub counts as passing.
  # It errs towards building: any other path, CHANGELOG.md (release.sh reads it, and release-prep PRs
  # deserve the full run), an empty diff, a push to main, and a failure here all build. Pushes to main
  # always build, since main is what releases are tagged from and what PRs' caches restore from.
  # Plain git rather than a paths-filter action, so there's no third-party code to pin or trust.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      # A pull_request run checks out the PR merged into its base, whose first parent is the base tip, so
      # two commits of history are enough for the PR's whole diff against what it would merge into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the build is needed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: always builds"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          build=false
          [[ -n "$files" ]] || build=true
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            case "$f" in
              CHANGELOG.md) build=true; echo "builds for: $f" ;;
              site/*|docs/*|*.md) ;;
              *) build=true; echo "builds for: $f" ;;
            esac
          done <<<"$files"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build=$build"

  # The companion's build and its tests, as two jobs on two runners so the run takes about as long as
  # the slower of them rather than both in a row: test.sh builds into its own DerivedData (Debug, beside
  # build.sh's Release) and reads none of build.sh's output. Both stand on the
  # same pinned Xcode, XcodeGen, idevice, and zsign, from one local action so their caches stay shared.
  companion-build:
    needs: changes
    # !cancelled() rather than the implicit success(): if changes fails, its output is empty, and a job
    # skipped because a needed job failed would read as passing; this way a failure there still builds.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/companion-deps

      # The device app's start screen face, Goodmountain, and its license (apps/client/spstart.m): its
      # license forbids changing or re-hosting the file, so it's never committed, and scripts/fetch-font.sh
      # downloads both at a pinned commit and checks their SHA-256. The companion bundles them; the tests
      # don't read them, so only this job fetches them.
      - name: Fetch the start screen's font
        run: scripts/fetch-font.sh

      # The shims for both platforms, from the committed shims/generated/, build inside this step:
      # bundle-resources.sh runs shims/build.sh <platform> into the app, beside the launcher, the JIT
      # helper, and the icon, and names the platform whose build failed. (Steps of their own here built
      # the same shims a second time.)
      # The notices the built app ships (Sparkle's, idevice's, zsign's, OpenSSL's, and the font's) are
      # checked inside this step too: bundle-resources.sh compares its own output, file for file, against
      # apps/companion/bundled-notices.txt and work/. (A test here once did that, compiling a Debug app
      # and test bundle on this runner for it; companion-test holds ClientAssembly's lists to that file.)
      - name: Build the companion (unsigned)
        run: apps/companion/build.sh

  companion-test:
    needs: changes
    # Gated like companion-build.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # idevice for every platform (test.sh's idevice-config.sh links the macOS one; AcknowledgementsTests
      # checks all three archives' notices) and zsign for macOS (DeviceSigningTests runs spsign.m on the
      # Mac). No font and no shims: the fixtures are built from research/loadertest and the committed
      # shims/generated/rewrite-map.txt, and the tests that read build/<platform>/exports.json are opt-in.
      - uses: ./.github/actions/companion-deps

      - name: Test the companion
        run: apps/companion/test.sh
