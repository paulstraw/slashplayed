# The Mac companion app: `./build.sh` generates the Xcode project from this and builds the app into
# build/companion/. The generated project and Info.plist aren't committed.
name: SPCompanion
options:
  deploymentTarget:
    macOS: "15.0"
packages:
  # Sparkle 2 for the companion's own updates. Pinned exactly: the setup below (non-sandboxed, so no XPC
  # services or entitlements; hardened runtime) follows this version's docs. Re-read
  # sparkle-project.org/documentation before bumping.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  SPCompanion:
    type: application
    platform: macOS
    sources:
      - Sources
      # The flavors' names, launch arguments, and addon numbers (Flavor.swift); the launcher's copy is
      # bundle-resources.sh's client/flavors.plist.
      - path: ../client/flavors.plist
        buildPhase: resources
      # The app icon: the device app's Icon Composer icon (apps/client/build-icons.sh), one source for
      # both. actool compiles it into Assets.car and writes AppIcon.icns for macOS 15.
      - path: ../client/icons/AppIcon.icon
        buildPhase: resources
    # idevice for Pairing.swift (idevice-config.sh writes it from scripts/build-idevice.sh's output).
    configFiles:
      Debug: Generated/idevice.xcconfig
      Release: Generated/idevice.xcconfig
    scheme:
      testTargets: [SPCompanionTests]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Slashplayed Companion
        # xcodegen writes 1.0 (1) unless told: the About panel, BindCheck's issue link and the diagnostics
        # all read these, so they follow the build settings (MARKETING_VERSION is the release version).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Straw Dynamics. MIT License.
        LSApplicationCategoryType: public.app-category.developer-tools
        # Sparkle: checks run on its schedule with no first-launch permission prompt, but an update is
        # never installed without the user's say-so. Settings' toggle writes SUEnableAutomaticChecks to
        # the defaults, which win over this.
        SUFeedURL: $(SP_SPARKLE_FEED_URL)
        SUPublicEDKey: $(SP_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_NAME: Slashplayed Companion
        PRODUCT_BUNDLE_IDENTIFIER: com.strawdynamics.slashplayed.companion
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        # ../client/icons/AppIcon.icon (sources above).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # Not sandboxed: it kills Battle.net's client, reads net.battle and runs xcrun. Hardened runtime
        # (notarization needs it) with no exceptions: everything it runs (lldb, devicectl, codesign) is a
        # separate process, so nothing here needs JIT, unsigned memory or other libraries' code. Its
        # library validation needs a Team ID, which ad hoc signing lacks, so Debug (run from Xcode) and
        # build.sh's ad hoc re-seal leave it off; Developer ID release builds have it.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        # Sparkle's feed, as a setting rather than a literal in Info.plist so a test build can point at a
        # local feed from the xcodebuild command line (scripts/release/update-test.sh).
        SP_SPARKLE_FEED_URL: https://slashplayed.strawdynamics.com/appcast.xml
        # The EdDSA public key updates are verified against (Sparkle's generate_keys --account
        # com.strawdynamics.slashplayed.companion; the private half is in the owner's login keychain
        # and the release environment's SPARKLE_ED_PRIVATE_KEY). A release build (SP_RELEASE_BUILD=YES,
        # which the release script sets) refuses the all-zero placeholder this once held.
        SP_SPARKLE_PUBLIC_KEY: Rssvp+KBKGjTg8ouHevMmSGA0SL95bzCgEcaby+apW4=
        SP_RELEASE_BUILD: NO
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          # Strips the debug map (N_SO/N_OSO stabs naming this Mac's source and object paths) from the
          # executable: a shipped app holds no path from the build machine (bundle-resources.sh checks).
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
    preBuildScripts:
      # A release shipped with the placeholder key could never be updated (every update would fail
      # verification), so a release build stops here instead.
      - name: Check Sparkle key
        basedOnDependencyAnalysis: false
        script: |
          if [ "$SP_RELEASE_BUILD" = YES ]; then
            case "$SP_SPARKLE_PUBLIC_KEY" in
              ""|AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=)
                echo "error: SP_SPARKLE_PUBLIC_KEY in apps/companion/project.yml is the placeholder; set the real Sparkle public key (generate_keys --account com.strawdynamics.slashplayed.companion) before a release build" >&2
                exit 1 ;;
            esac
            printf %s "$SP_SPARKLE_PUBLIC_KEY" | grep -qE '^[A-Za-z0-9+/]{43}=$' || {
              echo "error: SP_SPARKLE_PUBLIC_KEY '$SP_SPARKLE_PUBLIC_KEY' isn't a Sparkle EdDSA public key (44 base64 characters)" >&2
              exit 1
            }
          fi
    postBuildScripts:
      # Sparkle's license (with the notices of the code it bundles) into the Acknowledgements the About
      # panel links, from the very checkout the build resolved (DerivedData's SourcePackages, beside
      # Build/Products). bundle-resources.sh adds the rest and fails without this one.
      - name: Sparkle license
        inputFiles:
          - $(BUILD_DIR)/../../SourcePackages/checkouts/Sparkle/LICENSE
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Acknowledgements/Sparkle.txt
        script: |
          set -eu
          src="$SCRIPT_INPUT_FILE_0"
          [ -s "$src" ] || { echo "error: no Sparkle LICENSE at $src (has the SPM checkout moved?)" >&2; exit 1; }
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          # install, not cp: the checkout's files are read-only, and a copy that kept that mode would stop
          # the next incremental build from replacing it.
          install -m 0644 "$src" "$SCRIPT_OUTPUT_FILE_0"
    dependencies:
      - package: Sparkle
  # Unit tests for the parts of the app that stand alone (no host app: nothing launches). Each test file
  # lists the app sources it compiles in. ./test.sh runs them.
  SPCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/AboutLinks.swift
      - Sources/BindCheck.swift
      - Sources/BlizzardCDN.swift
      - Sources/ClientAssembly.swift
      - Sources/ClientStop.swift
      - Sources/ClientBuild.swift
      - Sources/DeveloperDiskImage.swift
      - Sources/Device.swift
      - Sources/DeviceIdentity.swift
      - Sources/DeviceLogs.swift
      - Sources/Diagnostics.swift
      - Sources/Flavor.swift
      - Sources/GameFiles.swift
      - Sources/GameInstall.swift
      - Sources/GameStore.swift
      - Sources/SetupStatus.swift
      - Sources/Shell.swift
      - Sources/Signing.swift
      - Sources/SlashplayedCertificate.swift
      - Sources/TokenRelay.swift
      - Sources/UpdateGate.swift
      - Sources/USBLink.swift
      # The launcher's CDN client and bind check (Foundation only), tested against BlizzardCDN and BindCheck.
      - ../client/spbind.m
      - ../client/spcdn.m
      # spguest's own check of a client file, which spcdn.m's sp_slice_problem runs (the loader itself, and
      # its thread-local trampoline it links, are guesttest's to run).
      - ../client/spguest.c
      - ../client/spguest_tlv.S
      - path: ../client/flavors.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strawdynamics.slashplayed.companion.tests
        SWIFT_OBJC_BRIDGING_HEADER: Tests/SPCompanionTests-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: -lz
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
